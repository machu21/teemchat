<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TeemChat</title>
    <style>
      html, body { margin: 0; height: 100%; background: #180D26; color: #fff; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        padding: 16px; box-sizing: border-box;
      }
      .card {
        max-width: 360px; width: 100%; padding: 24px; text-align: center;
        background: #2a1a40; border: 2px solid #fff; box-shadow: 3px 3.5px 0 #fff;
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 20px; line-height: 1.5; opacity: 0.85; }
      button {
        font: inherit; font-weight: 700; padding: 10px 20px; cursor: pointer;
        background: #ffd166; color: #180D26; border: 2px solid #fff; box-shadow: 3px 3.5px 0 #fff;
      }
      button:active { transform: translate(3px, 3.5px); box-shadow: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Can't reach TeemChat</h1>
      <p>Check your internet connection and try again.</p>
      <button type="button" onclick="location.href='https://www.teemchat.chat'">Try again</button>
    </div>
  </body>
</html>
